{% extends 'pillar.html' %}
{% load static %}

{% block content %}
<style>
  :root {
    --primary: #e11d48;
    --success: #16a34a;
    --success-dark: #15803d;
    --secondary: #0f172a;
    --muted: #64748b;
    --light-bg: #f8fafc;
    --shadow-lg: 0 30px 80px rgba(15, 23, 42, 0.16);
  }

  body { background: var(--light-bg); }

  .ma-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at top left, rgba(22, 163, 74, 0.14), transparent 32%),
      linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
  }

  .login-wrapper {
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid rgba(15, 23, 42, 0.08);
    border-radius: 32px;
    padding: 18px;
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(24px);
  }

  .login-panel { background: #fff; border-radius: 26px; padding: 50px 30px; text-align: center; }
  
  .login-logo {
    width: 80px; height: 80px; margin: 0 auto 20px; border-radius: 24px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--success), var(--success-dark));
    color: #fff; box-shadow: 0 18px 34px rgba(22, 163, 74, 0.30); font-size: 2.2rem;
  }

  .login-panel h2 { color: var(--secondary); font-weight: 900; letter-spacing: -0.04em; margin-bottom: 10px; }
  .login-panel p { color: var(--muted); margin-bottom: 35px; line-height: 1.7; font-size: 1.05rem; }

  .login-btn {
    width: 100%; min-height: 54px; border-radius: 16px;
    background: #fff; color: var(--secondary); border: 1px solid rgba(15, 23, 42, 0.10);
    font-weight: 900; box-shadow: 0 14px 32px rgba(15, 23, 42, 0.08); 
    transition: all 0.25s ease; display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none;
  }
  .login-btn:hover { transform: translateY(-2px); color: var(--primary); }
</style>

<div class="ma-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="login-wrapper">
                    <div class="login-panel">
                        
                        <div class="login-logo">
                            <i class="fa fa-check"></i>
                        </div>
                        
                        <h2>Request Submitted!</h2>
                        <p>Your leave request has been successfully forwarded to the administration. You will be notified via email once it is reviewed.</p>

                        <a href="/" class="login-btn">
                            <i class="fa fa-home me-2"></i> Return to Homepage
                        </a>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
