{% extends 'pillar.html' %}
{% load static %}

{% block content %}
<style>
  :root {
    --primary: #e11d48;
    --primary-dark: #be123c;
    --secondary: #0f172a;
    --muted: #64748b;
    --light-bg: #f8fafc;
    --shadow-lg: 0 30px 80px rgba(15, 23, 42, 0.16);
  }

  body { background: var(--light-bg); }

  .ma-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at top left, rgba(225, 29, 72, 0.14), transparent 32%),
      radial-gradient(circle at top right, rgba(22, 163, 74, 0.12), transparent 30%),
      linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
  }

  .login-wrapper {
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid rgba(15, 23, 42, 0.08);
    border-radius: 32px;
    padding: 18px;
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(24px);
  }

  .login-panel { background: #fff; border-radius: 26px; padding: 40px 30px; }
  
  .login-header { text-align: center; margin-bottom: 26px; }
  .login-logo {
    width: 68px; height: 68px; margin: 0 auto 15px; border-radius: 22px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; box-shadow: 0 18px 34px rgba(225, 29, 72, 0.30); font-size: 1.7rem;
  }
  .login-header h2 { color: var(--secondary); font-weight: 900; letter-spacing: -0.04em; margin-bottom: 5px; }
  .login-header p { color: var(--muted); margin: 0; }

  .login-panel label { color: var(--secondary); font-weight: 700; margin-bottom: 8px; }
  .login-panel input {
    width: 100%; min-height: 52px; border-radius: 16px !important;
    border: 1px solid #e2e8f0 !important; background: #f8fafc !important;
    padding: 12px 16px !important; outline: none !important; transition: all 0.22s ease;
  }
  .login-panel input:focus {
    border-color: rgba(225, 29, 72, 0.55) !important;
    box-shadow: 0 0 0 5px rgba(225, 29, 72, 0.10) !important;
    background: #fff !important;
  }

  .login-btn {
    width: 100%; min-height: 54px; border-radius: 16px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border: 0; font-weight: 900;
    box-shadow: 0 18px 36px rgba(225, 29, 72, 0.28); transition: all 0.25s ease;
  }
  .login-btn:hover { transform: translateY(-2px); color: #fff; }
</style>

<div class="ma-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="login-wrapper">
                    <div class="login-panel">
                        
                        <div class="login-header">
                            <div class="login-logo">
                                <i class="fa fa-fingerprint"></i>
                            </div>
                            <h2>Verify Identity</h2>
                            <p>Enter your details to request a leave</p>
                        </div>

                        {% for i in messages %}
                        <div class="alert alert-danger alert-dismissible fade show border rounded-4 text-center" role="alert">
                            {{ i }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endfor %}

                        <form action="{% url 'management:askVerify' %}" method="post" class="login-form">
                            {% csrf_token %}
                            <div class="mb-4">
                                <label>Email Address or Phone Number</label>
                                <input type="text" name="code" placeholder="e.g. 9800000000 or name@email.com" required>
                            </div>

                            <button type="submit" class="login-btn">
                                Verify & Continue <i class="fa fa-arrow-right ms-2"></i>
                            </button>
                            
                            <p class="text-center mt-4 mb-0">
                                <a href="/" class="text-decoration-none fw-bold" style="color: var(--muted);">
                                    <i class="fa fa-arrow-left me-1"></i> Back to Home
                                </a>
                            </p>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
