{% extends 'dashboard.html' %}
{% block title %}Create Bill | Staff Portal{% endblock title %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      {% for msg in messages %}
      <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
      {% endfor %}
      <div class="card border-0 shadow-sm p-4" style="border-radius:12px;">
        <h5 class="fw-bold mb-4">Create Bill</h5>
        <form method="post" id="billForm">
          {% csrf_token %}
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Member</label>
              <select name="member_id" class="form-select" required>
                <option value="" disabled selected>Select member...</option>
                {% for m in members %}<option value="{{ m.id }}">{{ m.name }}</option>{% endfor %}
              </select>
            </div>
            <div class="col-md-6"><label class="form-label small fw-bold">Due Date</label><input type="date" name="due_date" class="form-control" required></div>
          </div>

          <div id="items">
            <div class="row g-2 mb-2 item-row">
              <div class="col-7"><input type="text" name="description" class="form-control" placeholder="Description"></div>
              <div class="col-5"><input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount"></div>
            </div>
          </div>
          <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addItemRow()">+ Add Item</button>

          <div class="mb-3"><label class="form-label small fw-bold">Remarks</label><textarea name="remarks" class="form-control" rows="2"></textarea></div>
          <div class="form-check mb-3">
            <input type="checkbox" name="send_email" class="form-check-input" id="sendEmail">
            <label class="form-check-label" for="sendEmail">Email the invoice to the member</label>
          </div>
          <button type="submit" class="btn btn-primary">Create Bill</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
function addItemRow() {
  const div = document.createElement('div');
  div.className = 'row g-2 mb-2 item-row';
  div.innerHTML = '<div class="col-7"><input type="text" name="description" class="form-control" placeholder="Description"></div>' +
                  '<div class="col-5"><input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount"></div>';
  document.getElementById('items').appendChild(div);
}
</script>
{% endblock content %}
