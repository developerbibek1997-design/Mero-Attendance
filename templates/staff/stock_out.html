{% extends 'dashboard.html' %}
{% block title %}Stock Out | Staff Portal{% endblock title %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      {% for msg in messages %}
      <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
      {% endfor %}
      <div class="card border-0 shadow-sm p-4" style="border-radius:12px;">
        <h5 class="fw-bold mb-4">Record Stock Out</h5>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label small fw-bold">Item</label>
            <select name="item" class="form-select" required>
              <option value="" disabled selected>Select item...</option>
              {% for i in items %}<option value="{{ i.id }}">{{ i.name }} ({{ i.quantity }} {{ i.unit }} available)</option>{% endfor %}
            </select>
          </div>
          <div class="mb-3"><label class="form-label small fw-bold">Quantity</label><input type="number" step="0.01" name="quantity" class="form-control" required></div>
          <div class="mb-3"><label class="form-label small fw-bold">Date</label><input type="date" name="movement_date" class="form-control" value="{{ today }}"></div>
          <div class="mb-3"><label class="form-label small fw-bold">Note</label><textarea name="note" class="form-control" rows="2"></textarea></div>
          <button type="submit" class="btn btn-primary">Record Stock Out</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
