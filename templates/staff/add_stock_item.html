{% extends 'dashboard.html' %}
{% block title %}Add Stock Item | Staff Portal{% endblock title %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      {% for msg in messages %}
      <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
      {% endfor %}
      <div class="card border-0 shadow-sm p-4" style="border-radius:12px;">
        <h5 class="fw-bold mb-4">Add Stock Item</h5>
        <form method="post">
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label small fw-bold">Name</label><input type="text" name="name" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label small fw-bold">SKU</label><input type="text" name="sku" class="form-control"></div>
            <div class="col-md-6"><label class="form-label small fw-bold">Unit</label><input type="text" name="unit" class="form-control" value="pcs"></div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Branch</label>
              <select name="branch" class="form-select"><option value="">—</option>{% for b in branches %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}</select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Category</label>
              <select name="category" class="form-select"><option value="">—</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>
            </div>
            <div class="col-md-6"><label class="form-label small fw-bold">Low Stock Threshold</label><input type="number" name="low_stock_threshold" class="form-control" value="5"></div>
            <div class="col-md-6"><label class="form-label small fw-bold">Supplier</label><input type="text" name="supplier" class="form-control"></div>
            <div class="col-md-6"><label class="form-label small fw-bold">Purchase Cost / Unit</label><input type="number" step="0.01" name="purchase_cost" class="form-control"></div>
          </div>
          <button type="submit" class="btn btn-primary mt-4">Add Item</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
