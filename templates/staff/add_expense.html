{% extends 'dashboard.html' %}
{% block title %}Add Expense | Staff Portal{% endblock title %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      {% for msg in messages %}
      <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
      {% endfor %}
      <div class="card border-0 shadow-sm p-4" style="border-radius:12px;">
        <h5 class="fw-bold mb-4">Add Expense</h5>
        <form method="post">
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label small fw-bold">Title</label><input type="text" name="title" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label small fw-bold">Amount</label><input type="number" step="0.01" name="amount" class="form-control" required></div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Category</label>
              <select name="category" class="form-select"><option value="">—</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Branch</label>
              <select name="branch" class="form-select"><option value="">—</option>{% for b in branches %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}</select>
            </div>
            <div class="col-md-6"><label class="form-label small fw-bold">Date</label><input type="date" name="transaction_date" class="form-control" value="{{ today }}" required></div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Payment Method</label>
              <select name="payment_method" class="form-select"><option value="cash">Cash</option><option value="bank">Bank</option><option value="online">Online</option></select>
            </div>
            <div class="col-md-6"><label class="form-label small fw-bold">Reference No.</label><input type="text" name="reference_number" class="form-control"></div>
            <div class="col-12"><label class="form-label small fw-bold">Note</label><textarea name="note" class="form-control" rows="2"></textarea></div>
          </div>
          <button type="submit" class="btn btn-danger mt-4">Add Expense</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
