{% load static %}
{# Inline add/edit form for a timesheet entry. Swaps in place of entry row or add-row trigger. #}
<tr id="{% if entry %}entry-row-{{ entry.pk }}{% else %}entry-add-form{% endif %}">
  <td colspan="4" class="p-0">
    <div class="ts-inline-form p-3">
      {% if errors %}
      <div class="d-flex flex-wrap gap-2 mb-2">
        {% for e in errors %}
        <span class="badge bg-danger-subtle text-danger">{{ e }}</span>
        {% endfor %}
      </div>
      {% endif %}
      <form
        {% if entry %}
          hx-post="{% url 'staff:ts_entry_edit' pk=ts.pk entry_pk=entry.pk %}"
        {% else %}
          hx-post="{% url 'staff:ts_entry_add' pk=ts.pk %}"
        {% endif %}
        hx-target="#{% if entry %}entry-row-{{ entry.pk }}{% else %}entry-add-form{% endif %}"
        hx-swap="outerHTML"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
      >
        <div class="row g-2 align-items-end">
          <div class="col-12 col-sm-4">
            <label class="form-label small fw-semibold mb-1">Task / Project</label>
            <input type="text" name="task" class="form-control form-control-sm"
                   placeholder="e.g. Report writing" maxlength="300"
                   value="{{ prev.task|default:'' }}" required>
          </div>
          <div class="col-6 col-sm-2">
            <label class="form-label small fw-semibold mb-1">Hours</label>
            <input type="number" name="hours" class="form-control form-control-sm"
                   step="0.25" min="0.25" max="24"
                   placeholder="0.0"
                   value="{{ prev.hours|default:'' }}" required>
          </div>
          <div class="col-6 col-sm-3">
            <label class="form-label small fw-semibold mb-1">Notes</label>
            <input type="text" name="notes" class="form-control form-control-sm"
                   placeholder="Optional notes"
                   value="{{ prev.notes|default:'' }}">
          </div>
          <div class="col-12 col-sm-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-sm fw-semibold flex-grow-1">
              <i class="fas fa-check me-1"></i>{% if entry %}Save{% else %}Add{% endif %}
            </button>
            {% if entry %}
            <button type="button" class="btn btn-outline-secondary btn-sm"
                    hx-get="{% url 'staff:ts_entry_edit' pk=ts.pk entry_pk=entry.pk %}?cancel=1"
                    hx-target="#entry-row-{{ entry.pk }}"
                    hx-swap="outerHTML">
              ✕
            </button>
            {% else %}
            <button type="button" class="btn btn-outline-secondary btn-sm"
                    hx-get="{% url 'staff:ts_entry_add' pk=ts.pk %}?cancel=1"
                    hx-target="#entry-add-form"
                    hx-swap="outerHTML">
              ✕
            </button>
            {% endif %}
          </div>
        </div>
      </form>
    </div>
  </td>
</tr>
