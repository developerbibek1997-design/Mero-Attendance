{% extends 'dashboard.html' %}
{% block title %}Create Bill | {{ org.name }}{% endblock %}
{% block content %}
<div class="container-fluid py-2">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between">
          <h6 class="mb-0 font-weight-bolder"><i class="fas fa-file-invoice-dollar text-primary me-2"></i>Create Invoice / Bill</h6>
          <a href="{% url 'schooladmin:bill_list' %}" class="btn btn-outline-secondary btn-sm">Back</a>
        </div>
        <div class="card-body p-4">
          {% for msg in messages %}<div class="alert alert-danger alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}
          <form method="post" id="billForm">
            {% csrf_token %}
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label text-xs font-weight-bold">Member *</label>
                <select name="member_id" class="form-select" required>
                  <option value="">-- Select Member --</option>
                  {% for m in members %}<option value="{{ m.id }}">{{ m.name }} ({{ m.member_type|title }})</option>{% endfor %}
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label text-xs font-weight-bold">Due Date *</label>
                {% if nepali_enabled %}
                <input type="text" class="form-control nepali-cal" name="due_date_np" placeholder="YYYY-MM-DD (BS)" autocomplete="off" required>
                <input type="date" class="hidden-date-input" name="due_date" value="">
                {% else %}
                <input type="date" name="due_date" class="form-control" required>
                {% endif %}
              </div>
            </div>

            <!-- Line Items -->
            <h6 class="font-weight-bold mb-2 mt-3">Bill Items</h6>
            <div id="lineItems">
              <div class="row g-2 mb-2 line-item">
                <div class="col-8"><input type="text" name="description" class="form-control form-control-sm" placeholder="Description (e.g. Tuition Fee)" required></div>
                <div class="col-3"><input type="number" name="amount" class="form-control form-control-sm amount-field" placeholder="Amount" step="0.01" min="0" required></div>
                <div class="col-1"><button type="button" class="btn btn-outline-danger btn-sm remove-item" style="display:none;"><i class="fas fa-times"></i></button></div>
              </div>
            </div>
            <button type="button" id="addItem" class="btn btn-outline-primary btn-sm mt-1"><i class="fas fa-plus me-1"></i>Add Item</button>

            <div class="mt-3 p-3 bg-light rounded">
              <div class="d-flex justify-content-between align-items-center">
                <span class="font-weight-bold">Total:</span>
                <span class="font-weight-bolder text-primary fs-5" id="totalDisplay">Rs. 0</span>
              </div>
            </div>

            <div class="mb-3 mt-3">
              <label class="form-label text-xs font-weight-bold">Remarks (optional)</label>
              <textarea name="remarks" class="form-control" rows="2" placeholder="Any notes for this invoice..."></textarea>
            </div>

            <div class="mb-4">
              <div class="form-check">
                <input type="checkbox" name="send_email" class="form-check-input" id="sendEmail" checked>
                <label class="form-check-label text-sm" for="sendEmail"><i class="fas fa-envelope me-1 text-primary"></i>Email this invoice to the member</label>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary"><i class="fas fa-file-invoice me-1"></i>Create Bill</button>
              <a href="{% url 'schooladmin:bill_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
function updateTotal() {
  let total = 0;
  document.querySelectorAll('.amount-field').forEach(f => { total += parseFloat(f.value) || 0; });
  document.getElementById('totalDisplay').textContent = 'Rs. ' + total.toFixed(2);
}
document.getElementById('addItem').addEventListener('click', function() {
  const row = `<div class="row g-2 mb-2 line-item">
    <div class="col-8"><input type="text" name="description" class="form-control form-control-sm" placeholder="Description" required></div>
    <div class="col-3"><input type="number" name="amount" class="form-control form-control-sm amount-field" placeholder="Amount" step="0.01" min="0" required oninput="updateTotal()"></div>
    <div class="col-1"><button type="button" class="btn btn-outline-danger btn-sm remove-item"><i class="fas fa-times"></i></button></div>
  </div>`;
  document.getElementById('lineItems').insertAdjacentHTML('beforeend', row);
});
document.getElementById('lineItems').addEventListener('click', function(e) {
  if (e.target.closest('.remove-item')) {
    const items = document.querySelectorAll('.line-item');
    if (items.length > 1) { e.target.closest('.line-item').remove(); updateTotal(); }
  }
});
document.getElementById('lineItems').addEventListener('input', updateTotal);
</script>
{% endblock %}
