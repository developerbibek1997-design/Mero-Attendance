{% extends 'dashboard.html' %}
{% load static %}
{% block title %}
    Add Location Based Attendance 
{% endblock title %}
{% block content %}

<div class="row">
    <h2>Add / Edit Location</h2>
    <form method="post" >
      {% csrf_token %}
      <div class="row">
          {{form}}
          <div id="map" class="mt-3" style="height: 400px;"></div>
          <input class="btn btn-primary mt-3" type="submit" value="Save">
      </div>
    
    </form>
    

<script src="https://maps.googleapis.com/maps/api/js?key=&callback=initMap" async defer></script>
<script>
  let map, marker;
  function initMap() {
    const defaultLocation = { lat: 27.700769, lng: 85.300140 };  // Default Kathmandu
    map = new google.maps.Map(document.getElementById("map"), {
      center: defaultLocation,
      zoom: 15
    });

    marker = new google.maps.Marker({
      position: defaultLocation,
      map,
      draggable: true
    });

    google.maps.event.addListener(marker, 'dragend', function() {
      document.getElementById("id_latitude").value = marker.getPosition().lat();
      document.getElementById("id_longitude").value = marker.getPosition().lng();
    });

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        const pos = {
          lat: position.coords.latitude,
          lng: position.coords.longitude
        };
        map.setCenter(pos);
        marker.setPosition(pos);
        document.getElementById("id_latitude").value = pos.lat;
        document.getElementById("id_longitude").value = pos.lng;
      });
    }
  }
</script>
</div>
{% endblock content %}
