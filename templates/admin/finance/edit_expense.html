{% extends 'dashboard.html' %}
{% block title %}Edit Expense | {{ org.name }}{% endblock %}
{% block content %}
<div class="container-fluid py-2">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom py-3">
          <h6 class="mb-0 font-weight-bolder"><i class="fas fa-edit text-primary me-2"></i>Edit Expense</h6>
        </div>
        <div class="card-body p-4">
          <form method="post">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-12"><label class="form-label text-xs text-uppercase font-weight-bold">Title</label><input type="text" name="title" class="form-control" value="{{ tx.title }}" required></div>
              <div class="col-md-6"><label class="form-label text-xs text-uppercase font-weight-bold">Amount</label><input type="number" step="0.01" name="amount" class="form-control" value="{{ tx.amount }}"></div>
              <div class="col-md-6"><label class="form-label text-xs text-uppercase font-weight-bold">Date</label>
                {% if nepali_enabled %}
                <input type="text" class="form-control nepali-cal" name="transaction_date_np" placeholder="YYYY-MM-DD (BS)" autocomplete="off">
                <input type="date" class="hidden-date-input" name="transaction_date" value="{{ tx.transaction_date|date:'Y-m-d' }}">
                {% else %}
                <input type="date" name="transaction_date" class="form-control" value="{{ tx.transaction_date|date:'Y-m-d' }}">
                {% endif %}
              </div>
              <div class="col-md-6"><label class="form-label text-xs text-uppercase font-weight-bold">Category</label>
                <select name="category" class="form-select"><option value="">-- None --</option>{% for c in categories %}<option value="{{ c.id }}" {% if tx.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
              <div class="col-md-6"><label class="form-label text-xs text-uppercase font-weight-bold">Branch</label>
                <select name="branch" class="form-select"><option value="">-- None --</option>{% for b in branches %}<option value="{{ b.id }}" {% if tx.branch_id == b.id %}selected{% endif %}>{{ b.name }}</option>{% endfor %}</select></div>
              <div class="col-md-6"><label class="form-label text-xs text-uppercase font-weight-bold">Payment Method</label>
                <select name="payment_method" class="form-select"><option value="cash" {% if tx.payment_method == 'cash' %}selected{% endif %}>Cash</option><option value="bank" {% if tx.payment_method == 'bank' %}selected{% endif %}>Bank</option><option value="card" {% if tx.payment_method == 'card' %}selected{% endif %}>Card</option><option value="online" {% if tx.payment_method == 'online' %}selected{% endif %}>Online</option><option value="other" {% if tx.payment_method == 'other' %}selected{% endif %}>Other</option></select></div>
              <div class="col-md-6"><label class="form-label text-xs text-uppercase font-weight-bold">Reference</label><input type="text" name="reference_number" class="form-control" value="{{ tx.reference_number|default:'' }}"></div>
              <div class="col-12"><label class="form-label text-xs text-uppercase font-weight-bold">Note</label><textarea name="note" class="form-control" rows="2">{{ tx.note|default:'' }}</textarea></div>
              <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Update</button>
                <a href="{% url 'schooladmin:expense_list' %}" class="btn btn-outline-secondary">Cancel</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
