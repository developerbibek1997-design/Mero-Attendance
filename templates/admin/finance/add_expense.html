{% extends 'dashboard.html' %}
{% block title %}Add Expense | {{ org.name }}{% endblock %}
{% block content %}
<div class="container-fluid py-2">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom py-3">
          <h6 class="mb-0 font-weight-bolder"><i class="fas fa-minus-circle text-danger me-2"></i>Add Expense</h6>
        </div>
        <div class="card-body p-4">
          {% for msg in messages %}<div class="alert alert-danger alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}
          <form method="post">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-12"><label class="form-label text-xs text-uppercase font-weight-bold">Title *</label><input type="text" name="title" class="form-control" placeholder="e.g. Office Supplies" required></div>
              <div class="col-md-6"><label class="form-label text-xs text-uppercase font-weight-bold">Amount (Rs.) *</label><input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" required></div>
              <div class="col-md-6"><label class="form-label text-xs text-uppercase font-weight-bold">Date *</label><input type="date" name="transaction_date" class="form-control" value="{{ today }}" required></div>
              <div class="col-md-6"><label class="form-label text-xs text-uppercase font-weight-bold">Category</label>
                <select name="category" class="form-select"><option value="">-- None --</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div>
              <div class="col-md-6"><label class="form-label text-xs text-uppercase font-weight-bold">Branch</label>
                <select name="branch" class="form-select"><option value="">-- All --</option>{% for b in branches %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}</select></div>
              <div class="col-md-6"><label class="form-label text-xs text-uppercase font-weight-bold">Payment Method</label>
                <select name="payment_method" class="form-select"><option value="cash">Cash</option><option value="bank">Bank</option><option value="card">Card</option><option value="online">Online</option><option value="other">Other</option></select></div>
              <div class="col-md-6"><label class="form-label text-xs text-uppercase font-weight-bold">Reference</label><input type="text" name="reference_number" class="form-control" placeholder="Optional"></div>
              <div class="col-12"><label class="form-label text-xs text-uppercase font-weight-bold">Note</label><textarea name="note" class="form-control" rows="2"></textarea></div>
              <div class="col-12 d-flex gap-2 mt-2">
                <button type="submit" class="btn btn-danger"><i class="fas fa-save me-1"></i>Save Expense</button>
                <a href="{% url 'schooladmin:expense_list' %}" class="btn btn-outline-secondary">Cancel</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
