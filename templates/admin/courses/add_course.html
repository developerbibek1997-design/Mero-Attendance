{% extends 'dashboard.html' %}
{% block title %}Add Course | {{ org.name }}{% endblock %}
{% block content %}
<div class="container-fluid py-2">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom py-3">
          <h6 class="mb-0 font-weight-bolder"><i class="fas fa-book text-primary me-2"></i>Add Course</h6>
        </div>
        <div class="card-body p-4">
          {% for msg in messages %}<div class="alert alert-danger alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}
          <form method="post">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-8"><label class="form-label text-xs font-weight-bold">Course Name *</label><input type="text" name="name" class="form-control" required></div>
              <div class="col-md-4"><label class="form-label text-xs font-weight-bold">Course Code</label><input type="text" name="code" class="form-control" placeholder="e.g. ENG-101"></div>
              <div class="col-md-6"><label class="form-label text-xs font-weight-bold">Branch</label>
                <select name="branch" class="form-select"><option value="">-- All --</option>{% for b in branches %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}</select></div>
              <div class="col-md-6"><label class="form-label text-xs font-weight-bold">Course Coordinator <small class="text-muted">(optional)</small></label>
                <select name="teacher" class="form-select"><option value="">-- None --</option>{% for s in staff_list %}<option value="{{ s.admin.id }}">{{ s.member.name }}</option>{% endfor %}</select></div>
              <div class="col-md-4"><label class="form-label text-xs font-weight-bold">Credit Hours</label><input type="number" step="0.5" name="credit_hour" class="form-control" value="0"></div>
              <div class="col-md-4"><label class="form-label text-xs font-weight-bold">Status</label>
                <select name="status" class="form-select"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
              <div class="col-md-4"></div>
              <div class="col-md-6"><label class="form-label text-xs font-weight-bold">Classifications</label>
                <select name="classifications" class="form-select" multiple size="4">{% for c in classifications %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>
                <small class="text-muted">Hold Ctrl/Cmd to select multiple</small></div>
              <div class="col-md-6"><label class="form-label text-xs font-weight-bold">Sections</label>
                <select name="sections" class="form-select" multiple size="4">{% for s in sections %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div>
              <div class="col-12"><label class="form-label text-xs font-weight-bold">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
              <div class="col-12 d-flex gap-2"><button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Save Course</button><a href="{% url 'schooladmin:course_list' %}" class="btn btn-outline-secondary">Cancel</a></div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
