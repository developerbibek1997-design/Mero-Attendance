{% extends 'dashboard.html' %}
{% block content %}
<div class="container-fluid py-4">
  <div class="row">
    <div class="col-lg-6 mx-auto">
      <div class="card p-4 shadow-sm">
        <h5 class="mb-4">Configure Auto Check-in</h5>
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label text-xs font-weight-bold text-uppercase">{{ field.label }}</label>
              {{ field }}
            </div>
          {% endfor %}
          <button type="submit" class="btn bg-gradient-success w-100 mt-3">Save Attendance Log</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
    // Make sure all form inputs have the 'form-control' class for the premium styling
    document.querySelectorAll('input, select').forEach(el => el.classList.add('form-control'));
</script>
{% endblock content %}
