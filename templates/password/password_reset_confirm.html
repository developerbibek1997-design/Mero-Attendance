{% extends 'pillar.html' %}

{% block title %}
Set new password
{% endblock title %}

{% block content %}

<style>
  .auth-wrapper {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 15px;
    background: linear-gradient(135deg, #f7f9fc, #eef3ff);
  }

  .auth-card {
    width: 100%;
    max-width: 560px;
    background: #ffffff;
    border-radius: 18px;
    padding: 35px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
  }

  .auth-card h2 {
    font-weight: 700;
    color: #1f2937;
  }

  .auth-card p {
    color: #6b7280;
    font-size: 15px;
    line-height: 1.6;
  }

  .auth-card form p {
    margin-bottom: 18px;
  }

  .auth-card label {
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
    display: block;
  }

  .auth-card input {
    width: 100%;
    height: 45px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 10px 14px;
    outline: none;
    transition: 0.3s;
  }

  .auth-card input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .auth-card ul {
    font-size: 13px;
    color: #6b7280;
    padding-left: 18px;
    margin-top: 8px;
  }

  .auth-btn {
    width: 100%;
    height: 45px;
    border-radius: 10px;
    font-weight: 600;
    margin-top: 10px;
  }

  .auth-icon {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #e0ecff;
    color: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 18px;
  }
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-icon">
      <i class="fas fa-key"></i>
    </div>

    <h2>Create New Password</h2>

    <p>
      Please enter your new password below. Make sure your password is strong
      and easy for you to remember.
    </p>

    <hr>

    <form method="POST">
      {% csrf_token %}

      {{ form.as_p }}

      <button class="btn btn-primary auth-btn" type="submit">
        Reset Password
      </button>
    </form>
  </div>
</div>

{% endblock content %}
