{% extends 'pillar.html' %}

{% block title %}
Password reset complete
{% endblock title %}

{% block content %}

<style>
  .auth-wrapper {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 15px;
    background: linear-gradient(135deg, #f7f9fc, #eef3ff);
  }

  .auth-card {
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    border-radius: 18px;
    padding: 35px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
  }

  .success-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #dcfce7;
    color: #16a34a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin: 0 auto 20px;
  }

  .auth-card h2 {
    font-weight: 700;
    color: #1f2937;
  }

  .auth-card p {
    color: #6b7280;
    font-size: 15px;
    line-height: 1.7;
  }

  .auth-btn {
    min-width: 160px;
    height: 45px;
    border-radius: 10px;
    font-weight: 600;
    margin-top: 15px;
  }
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="success-icon">
      <i class="fas fa-check"></i>
    </div>

    <h2>Password Reset Complete</h2>

    <p>
      Your password has been successfully changed.
      You can now log in using your new password.
    </p>

    <a href="{% url 'management:homepage' %}" class="btn btn-primary auth-btn">
      Log In
    </a>
  </div>
</div>

{% endblock content %}
