<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Something Went Wrong | Mero Attendance</title>
  <link rel="icon" href="{% static 'img/favicon.png' %}">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #fff1f2 0%, #ffffff 55%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
      padding: 24px;
    }
    .nf-wrap { max-width: 480px; text-align: center; }
    .nf-code {
      font-size: 6.5rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #e11d48, #be123c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .nf-title { font-size: 1.5rem; font-weight: 800; margin: 0 0 12px; color: #0f172a; }
    .nf-desc { font-size: .95rem; color: #64748b; margin: 0 0 32px; line-height: 1.6; }
    .nf-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .nf-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: .9rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: all .2s ease;
    }
    .nf-btn-primary {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #ffffff !important;
      box-shadow: 0 14px 30px rgba(225, 29, 72, .28);
    }
    .nf-btn-primary:hover { box-shadow: 0 20px 40px rgba(225, 29, 72, .38); transform: translateY(-2px); }
    .nf-btn-outline {
      background: #ffffff;
      color: #334155 !important;
      border: 1px solid #e2e8f0;
    }
    .nf-btn-outline:hover { background: #f8fafc; }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <div class="nf-code">500</div>
    <h1 class="nf-title">Something Went Wrong</h1>
    <p class="nf-desc">We hit an unexpected error on our end — this is usually temporary. Please refresh the page and try again in a moment.</p>
    <div class="nf-actions">
      <button type="button" class="nf-btn nf-btn-primary" onclick="window.location.reload()">Refresh Page</button>
      <a href="{% url 'management:homepage' %}" class="nf-btn nf-btn-outline">Go to Homepage</a>
    </div>
  </div>
</body>
</html>
