{% load static %}
{# PWA install metadata — include inside <head>. Safe on every page. #}
<link rel="manifest" href="{% url 'pwa_manifest' %}">
<meta name="theme-color" content="#dc2626">
<meta name="application-name" content="Mero Attendance">
<meta name="mobile-web-app-capable" content="yes">

{# iOS ignores the manifest for install, so it needs its own set of tags. #}
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mero Attendance">
<link rel="apple-touch-icon" href="{% static 'pwa/apple-touch-icon.png' %}">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'pwa/icon-192.png' %}">
<link rel="icon" type="image/png" sizes="512x512" href="{% static 'pwa/icon-512.png' %}">
